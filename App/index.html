<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Heimside</title>
<!--    <script src="knapper.js" defer></script>-->
    <link href="style.css" rel="stylesheet" type="text/css"/>
</head>
<body>
    <div class="navbar">
        <a href="index.html">Heimsida</a>
        <a>Om-meg</a>
    </div>




    <div id="container">
        <form id="nyPerson">
            <fieldset>
                <legend>Legge inn namn og email:</legend>
                <label for="namn">Namn: <input id="namn" type="text" value="Teodor" placeholder="Skriv inn namn"></label>
                <label for="email">Email: <input type="text" id="email" name="email" value="teo@testmail.com" placeholder="Skriv inn mail her"></label>
                <button type="submit">Legg til info</button>
            </fieldset>
        </form>
    </div>

    <div id="output" class="hidden">
        <table>
            <thead>
                <tr>
                    <th>Namn</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

</body>
</html>
